[package]
name = "buzz-seat-listener"
version = "0.1.0"
edition = "2021"
publish = false
description = "Generic Buzz seat listener library -- connection, discovery, mailbox, lane classification, read-state gating. Zero fleet assumptions."
autobins = false
autoexamples = false

[lib]
name = "buzz_seat_listener"
path = "src/lib.rs"

[[example]]
name = "seat-listener"
path = "examples/seat-listener.rs"

[dependencies]
buzz-core      = { path = "../../crates/buzz-core" }
buzz-sdk       = { path = "../../crates/buzz-sdk" }
buzz-ws-client = { path = "../../crates/buzz-ws-client" }
nostr          = { workspace = true }
serde          = { workspace = true, features = ["derive"] }
serde_json     = { workspace = true }
tokio          = { workspace = true, features = ["rt-multi-thread", "macros", "time", "signal"] }
thiserror      = { workspace = true }
anyhow         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest        = { workspace = true, features = ["json"] }
uuid           = { workspace = true }
rand           = { workspace = true }
base64         = { workspace = true }
futures-util   = { workspace = true }
tokio-tungstenite = { workspace = true }
url            = { workspace = true }
tempfile       = "3"

[dev-dependencies]
tokio    = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
