[package]
name = "buzz-seat-clerk"
version = "0.1.0"
edition = "2021"
publish = false
description = "Headless per-seat delivery clerk for Buzz: connects, subscribes, delivers, badges, bookmarks."

[lib]
name = "buzz_seat_clerk"
path = "src/lib.rs"

[[bin]]
name = "clerk"
path = "src/bin/clerk.rs"

[dependencies]
buzz-core      = { path = "../../crates/buzz-core" }
buzz-sdk       = { path = "../../crates/buzz-sdk" }
buzz-ws-client = { path = "../../crates/buzz-ws-client" }
nostr          = { workspace = true }
serde          = { workspace = true, features = ["derive"] }
serde_json     = { workspace = true }
tokio          = { workspace = true, features = ["rt-multi-thread", "macros", "time", "signal"] }
thiserror      = { workspace = true }
anyhow         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest        = { workspace = true, features = ["json"] }
uuid           = { workspace = true }
rand           = { workspace = true }
base64         = { workspace = true }

[dev-dependencies]
tokio    = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = "3"
